name: Build BunkMESS EXE
on:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build BunkMESS.exe
        run: pake "https://github.io" --name "BunkMESS" --width 1150 --height 760

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunkMESS-Windows-EXE
          path: "**/*.exe"
