async function giveGift(from,to,id,text,free){
  const fid=idOf(from),g=gf(id);
  if(!fid||!to)throw new Error("Recipient not found. Reload the page and try again.");
  const ts=Date.now(),entry={g:g.id,by:fid,n:from.name,t:text||"",ts},msg={from:fid,to,participants:[fid,to],type:"gift",gift:g.id,text:text||"",ts,read:false};
  const stat={gifts:increment(1),messages:increment(1)};
  if(g.max){
    await runTransaction(db,async tx=>{
      const ref=doc(db,"nft",g.id),snap=await tx.get(ref),n=snap.exists()?(snap.data().minted||0):0;
      if(n>=g.max)throw new Error(g.n+" is sold out");
      entry.no=msg.no=n+1;
      tx.set(ref,{minted:n+1},{merge:true});
      if(!free)tx.update(doc(db,"users",fid),{coins:increment(-g.c)});
      tx.update(doc(db,"users",to),{gifts:arrayUnion(entry)});
      tx.set(doc(collection(db,"messages")),msg);
      tx.set(doc(db,"stats","global"),stat,{merge:true});
    });
    return entry.no;
  }
  const b=writeBatch(db);
  if(!free)b.update(doc(db,"users",fid),{coins:increment(-g.c)});
  b.update(doc(db,"users",to),{gifts:arrayUnion(entry)});
  b.set(doc(collection(db,"messages")),msg);
  b.set(doc(db,"stats","global"),stat,{merge:true});
  await b.commit();
}

function Login(){
  const [ph,setPh]=useState(""),[code,setCode]=useState(""),[conf,setConf]=useState(null),[err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const clean=ph.replace(/[\s()-]/g,"");
  const send=async()=>{
    setErr(""); if(!/^\+\d{8,15}$/.test(clean))return setErr("Use international format, e.g. +14155550123");
    setBusy(true);
    try{ try{window.rv?.clear()}catch{} window.rv=new RecaptchaVerifier(auth,"rc",{size:"invisible"}); setConf(await signInWithPhoneNumber(auth,clean,window.rv)); }
    catch(e){ setErr(e.code==="auth/unauthorized-domain"?"Add this website's domain in Firebase -> Authentication -> Settings -> Authorized domains":e.message); try{window.rv?.clear()}catch{} }
    setBusy(false);
  };
  const verify=async e=>{ e.preventDefault(); setBusy(true); setErr(""); try{await conf.confirm(code.trim())}catch{setErr("Wrong or expired code. Try again.")} setBusy(false); };
  return(
    <div className="min-h-screen grid place-items-center p-4">
      <div className="pn rounded-3xl shadow-lg w-full max-w-sm overflow-hidden">
        <div className="acb p-6 text-center"><Send className="mx-auto mb-2" size={36}/><h1 className="text-2xl font-bold tracking-wide">BunkMESS</h1><p className="text-white/80 text-sm">{tr("Sign in with your phone number")}</p></div>
        <div className="p-6 space-y-3">
          {!conf?<>
            <input className="inp" type="tel" placeholder="+1 415 555 0123" value={ph} onChange={e=>setPh(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
            <button disabled={busy} onClick={send} className={B+" w-full"}>{busy?tr("Sending…"):tr("Send SMS code")}</button>
            <button onClick={()=>setPh(ADMIN_PHONE)} className="w-full text-sm act">{tr("Admin quick login")}</button>
          </>:<form onSubmit={verify} className="space-y-3">
            <p className="text-sm mu">{tr("Enter the 6-digit code sent to")} {clean}</p>
            <input className="inp text-center tracking-widest text-lg" inputMode="numeric" maxLength={6} placeholder="••••••" value={code} onChange={e=>setCode(e.target.value)} autoFocus/>
            <button disabled={busy||code.length<6} className={B+" w-full"}>{busy?tr("Checking…"):tr("Verify and continue")}</button>
            <button type="button" onClick={()=>{setConf(null);setCode("")}} className="w-full text-sm mu">{tr("Use a different number")}</button>
          </form>}
          {err&&<p className="text-sm text-red-500">{err}</p>}

  const coins=u=>{const v=Number(prompt(`Coins for ${u.name}: add (e.g. 100) or remove (e.g. -100)`,"100"));if(v)upd(u,{coins:increment(Math.round(v))})};
  const fm=all.filter(m=>(nm(m.from)+" "+nm(m.to)+" "+(m.text||"")).toLowerCase().includes(fq.toLowerCase()));
  const target=users.find(x=>idOf(x)===to)||users.find(x=>idOf(x)!==idOf(me));
  const tabs={users:"Users",mod:"Moderation",eco:"Gifts & Economy",stats:"Analytics"};
  const card="pn rounded-2xl p-4 shadow-sm space-y-2";
  const btn=(on,c)=>`w-9 h-9 grid place-items-center rounded-lg ${on?c:"sel"}`;
  return(
    <div className="flex-1 overflow-y-auto p-4 md:p-6 pb-28 md:pb-6 space-y-4 tx">
      <h2 className="text-xl font-bold flex items-center gap-2"><Shield className="act"/>Admin Panel</h2>
      <div className="flex flex-wrap gap-2">{Object.entries(tabs).map(([k,l])=><button key={k} onClick={()=>setT(k)} className={`rounded-xl px-3 py-1.5 text-sm font-semibold ${t===k?"acb":"pn"}`}>{l}</button>)}</div>

      {t==="users"&&<div className="space-y-3">
        <input className="inp pn" placeholder="Search users" value={q} onChange={e=>setQ(e.target.value)}/>
        <div className="pn rounded-2xl shadow-sm divide-y bl">{users.filter(u=>(u.name+u.username).toLowerCase().includes(q.toLowerCase())).map(u=>(
          <div key={u.uid} className="flex items-center gap-3 p-3 flex-wrap">
            <Avatar u={u} size={40}/>
            <div className="min-w-0 flex-1"><Name u={u}/><div className="text-xs mu">@{u.username}{u.banned&&<span className="text-red-500 font-semibold"> (banned)</span>}</div></div>
            <button onClick={()=>coins(u)} className="sel rounded-lg px-2 h-9 text-sm flex items-center gap-1"><Coins size={15}/>{u.coins||0}</button>
            {u.username!==ADMIN_USERNAME&&<div className="flex gap-1.5">
              <button title="Toggle verified" onClick={()=>upd(u,{verified:!u.verified})} className={btn(u.verified,"bg-blue-500/20 text-[#2787f5]")}><BadgeCheck size={18}/></button>
              <button title="Ban / unban" onClick={()=>upd(u,{banned:!u.banned})} className={btn(u.banned,"bg-red-500/20 text-red-500")}><Ban size={18}/></button>
              <button title="Delete account" onClick={()=>del(u)} className={btn(false)}><Trash2 size={18}/></button></div>}
          </div>))}</div></div>}

      {t==="mod"&&<div className="space-y-3">
        <div className={card}><div className="font-semibold flex items-center gap-2"><Megaphone size={18}/>Global announcement</div>
          <textarea className="inp resize-none" rows={2} placeholder="Pinned for everyone" value={a} onChange={e=>setA(e.target.value)}/>
          <button onClick={async()=>{if(!a.trim())return;await addDoc(collection(db,"announcements"),{text:a.trim(),ts:Date.now()});setA("")}} className={B}>Broadcast</button>
          {ann.slice().reverse().map(x=><div key={x.id} className="flex items-center gap-2 text-sm"><span className="flex-1 truncate">{x.text}</span><button onClick={()=>deleteDoc(doc(db,"announcements",x.id))} className="text-red-500"><X size={16}/></button></div>)}</div>
        <div className={card}><div className="font-semibold">Messages ({fm.length})</div>
          <input className="inp" placeholder="Filter by name or text" value={fq} onChange={e=>setFq(e.target.value)}/>
          <button disabled={!fm.length} onClick={()=>confirm(`Delete ${Math.min(fm.length,450)} message(s)?`)&&batch(fm,(b,m)=>b.delete(doc(db,"messages",m.id)))} className="rounded-xl px-3 py-1.5 text-sm bg-red-500 text-white disabled:opacity-40">Clear {fq?"matching":"all"} messages</button>
          <div className="divide-y bl max-h-80 overflow-y-auto">{fm.slice(0,60).map(m=>(
            <div key={m.id} className="flex items-center gap-2 py-2 text-sm"><span className="flex-1 min-w-0 truncate"><b>{nm(m.from)}</b> to <b>{nm(m.to)}</b>: {prev(m)}</span>
              <button onClick={()=>deleteDoc(doc(db,"messages",m.id))} className="text-red-500 shrink-0"><Trash2 size={15}/></button></div>))}</div></div></div>}

      {t==="eco"&&<div className="space-y-3">
        <div className={card}><div className="font-semibold">Send a free gift</div>
          <select className="inp" value={target?.uid||""} onChange={e=>setTo(e.target.value)}>{users.filter(u=>idOf(u)!==idOf(me)).map(u=><option key={idOf(u)} value={idOf(u)}>{u.name} (@{u.username})</option>)}</select>
          <div className="flex flex-wrap gap-2">{ALL.map(x=><button key={x.id} title={x.n} onClick={()=>setGi(x.id)} className={`sel rounded-xl px-3 py-1.5 text-2xl ${gi===x.id?"ring-2 ring-[var(--acc)]":""}`}><GImg g={x} size={32}/></button>)}</div>
          <button disabled={!target} onClick={async()=>{await giveGift(me,idOf(target),gi,"A gift from the admin",true);setNote("Gift sent")}} className={B}>Send {gf(gi).n} for free</button></div>
        <div className={card}><div className="font-semibold">Coins for everyone</div>
          <input className="inp" type="number" value={amt} onChange={e=>setAmt(Number(e.target.value))}/>
          <div className="flex flex-wrap gap-2">
            <button onClick={async()=>{await batch(users,(b,u)=>b.update(doc(db,"users",idOf(u)),{coins:increment(amt)}));setNote("Coins added")}} className={B}>Give {amt} to all</button>
            <button onClick={async()=>{if(confirm(`Reset everyone to ${START_COINS} coins?`)){await batch(users,(b,u)=>b.update(doc(db,"users",idOf(u)),{coins:START_COINS}));setNote("Balances reset")}}} className="sel rounded-xl px-4 py-2 font-semibold">Reset all to {START_COINS}</button></div></div>
        {note&&<p className="text-sm text-green-500">{note}</p>}</div>}

      {t==="stats"&&<div className="grid grid-cols-2 gap-3">
        <Stat l="Total users" v={users.length}/><Stat l="Online now" v={users.filter(u=>online(u,now)).length}/>
        <Stat l="Total messages" v={stats.messages||0}/><Stat l="Total gifts sent" v={stats.gifts||0}/></div>}
    </div>);
}

function Messenger({me,users,logout,prefs,save}){
  const admin=me.username===ADMIN_USERNAME;
  const [tab,setTab]=useState("chats"),[peer,setPeer]=useState(null),[q,setQ]=useState(""),[text,setText]=useState(""),[emo,setEmo]=useState(false);
  const [prof,setProf]=useState(null),[giftTo,setGiftTo]=useState(null),[anim,setAnim]=useState(null),[dl,setDl]=useState(0),[hit,setHit]=useState(false);
  const seenIds=useRef(null),pc=useRef(me.coins||0);
  const [msgs,setMsgs]=useState([]),[ann,setAnn]=useState([]),[stats,setStats]=useState({}),[now,setNow]=useState(Date.now());
  const end=useRef(null);
  const withId=s=>s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.ts-b.ts);

  useEffect(()=>{
    const u1=onSnapshot(query(collection(db,"messages"),where("participants","array-contains",me.uid)),s=>{
      const arr=withId(s);
      if(!seenIds.current)seenIds.current=new Set(arr.map(m=>m.id));
      else{const fresh=arr.filter(m=>!seenIds.current.has(m.id));fresh.forEach(m=>seenIds.current.add(m.id));
        const gm=fresh.filter(m=>m.type==="gift"&&m.to===me.uid&&Date.now()-m.ts<20000).pop();if(gm)setAnim({g:gf(gm.gift),no:gm.no})}
      setMsgs(arr)});
    const u2=onSnapshot(collection(db,"announcements"),s=>setAnn(withId(s)));
    const u3=onSnapshot(doc(db,"stats","global"),s=>setStats(s.data()||{}));
    const beat=()=>{updateDoc(doc(db,"users",me.uid),{lastSeen:Date.now()}).catch(()=>{});setNow(Date.now())};
    beat(); const i=setInterval(beat,30000);
    return()=>{u1();u2();u3();clearInterval(i)};
  },[me.uid]);

  useEffect(()=>{const c=me.coins||0;if(c!==pc.current){setDl(c-pc.current);pc.current=c;const t=setTimeout(()=>setDl(0),1800);return()=>clearTimeout(t)}},[me.coins]);
  const byId=id=>id?users.find(u=>idOf(u)===id):undefined;
  const peerU=byId(peer);
  const profU=byId(prof),giftU=byId(giftTo);
  const thread=useMemo(()=>msgs.filter(m=>m.from===peer||m.to===peer),[msgs,peer]);
  const convos=useMemo(()=>{
    const m={};
    msgs.forEach(x=>{const p=x.from===me.uid?x.to:x.from;m[p]=m[p]||{unread:0};m[p].last=x;if(x.to===me.uid&&!x.read)m[p].unread++;});
    return m;
  },[msgs]);
  const unreadAll=Object.values(convos).reduce((a,c)=>a+c.unread,0);

  useEffect(()=>{
    if(!peer)return;
    const un=msgs.filter(m=>m.from===peer&&m.to===me.uid&&!m.read);if(!un.length)return;
    const b=writeBatch(db);un.forEach(m=>b.update(doc(db,"messages",m.id),{read:true}));b.commit().catch(()=>{});
  },[msgs,peer]);
  useEffect(()=>{end.current?.scrollIntoView({behavior:"smooth"})},[thread.length,peer]);

  const openChat=id=>{if(!id)return;setPeer(id);setProf(null);setTab("chats")};
  const send=async()=>{
    const t=text.trim(),to=idOf(peerU);if(!t||!to||me.banned)return;setText("");setEmo(false);
    try{
      await addDoc(collection(db,"messages"),{from:idOf(me),to,participants:[idOf(me),to],type:"text",text:t,ts:Date.now(),read:false});
      setDoc(doc(db,"stats","global"),{messages:increment(1)},{merge:true});
    }catch(e){alert("Could not send: "+e.message)}
  };

  const list=users.filter(u=>u.uid!==me.uid)
    .filter(u=>tab==="users"||convos[u.uid])
    .filter(u=>(u.name+u.username).toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>tab==="users"?a.name.localeCompare(b.name):convos[b.uid].last.ts-convos[a.uid].last.ts);
  const view=tab==="settings"||(tab==="admin"&&admin)?tab:"chat";
  const showMain=view!=="chat"||!!peerU;
  const pin=ann[ann.length-1];
  const nav=(id,Icon,label,badge)=>(
    <button key={id} onClick={()=>setTab(id)} className={`relative flex-1 flex flex-col items-center gap-0.5 py-2 rounded-full transition ${tab===id?"dockon":"mu"}`}>
      <Icon size={22}/><span className="text-[10px] font-medium">{label}</span>
      {badge>0&&<span className="absolute top-1 right-[20%] min-w-4 h-4 px-1 rounded-full bg-red-500 text-white text-[10px] grid place-items-center">{badge}</span>}
    </button>);
  const inChat=view==="chat"&&!!peerU;
  const seenTxt=u=>online(u,now)?tr("online"):tr("last seen ")+seen(u.lastSeen||u.createdAt);

  return(
    <div className="flex tx overflow-hidden" style={{height:"100dvh"}}>
      <aside className={`${showMain?"hidden md:flex":"flex"} w-full md:w-80 pn flex-col shrink-0 md:m-3 md:mr-0 md:rounded-[28px] overflow-hidden`}>
        <div className="p-3 space-y-3">
          <div className="flex items-center gap-3 cursor-pointer" onClick={()=>setTab("settings")}>
            <Avatar u={me} size={44}/>
            <div className="min-w-0 flex-1"><Name u={me}/><div className="text-xs mu truncate">{tr("Account settings")}</div></div>
            <span className="relative text-sm mu flex items-center gap-1 shrink-0"><Coins size={14}/>{me.coins||0}{dl!==0&&<span className={`gdelta ${dl<0?"text-red-500":"text-green-500"}`}>{dl>0?"+":""}{dl}</span>}</span>
          </div>
          <div className="relative"><Search size={16} className="absolute left-4 top-3.5 mu"/>
            <input className="inp pill pl-10" placeholder={tr("Search")} value={q} onChange={e=>setQ(e.target.value)}/></div>
        </div>
        <div className="flex-1 overflow-y-auto pb-28">
          {list.length===0&&<p className="text-center text-sm mu p-6">{tab==="users"?tr("No users found."):tr("No chats yet. Open Users to start one.")}</p>}
          {list.map(u=>{const c=convos[u.uid];return(
            <div key={u.uid} onClick={()=>tab==="users"?setProf(idOf(u)):openChat(idOf(u))} className={`mx-2 flex items-center gap-3 px-3 py-2.5 rounded-2xl cursor-pointer hv ${peer===u.uid?"sel":""}`}>
              <span onClick={e=>{e.stopPropagation();setProf(idOf(u))}}><Avatar u={u} dot={online(u,now)}/></span>
              <div className="min-w-0 flex-1">
                <div className="flex justify-between gap-2"><Name u={u}/>{c&&<span className="text-xs mu shrink-0">{time(c.last.ts)}</span>}</div>
                <div className="flex justify-between gap-2">
                  <span className="text-sm mu truncate">{c?(c.last.from===me.uid?tr("You")+": ":"")+prev(c.last):"@"+u.username}</span>
                  {c&&c.unread>0&&<span className="min-w-5 h-5 px-1.5 rounded-full acb text-xs grid place-items-center shrink-0">{c.unread}</span>}
                </div>
              </div>
            </div>)})}
        </div>
      </aside>

      <main className={`${showMain?"flex":"hidden md:flex"} ${hit?"ghit":""} flex-1 flex-col min-w-0 pn md:m-3 md:rounded-[28px] overflow-hidden`}>
        {pin&&<div className="border-b bl px-4 py-2.5 flex items-center gap-2 text-sm" style={{borderLeft:"3px solid var(--acc)"}}>
          <Megaphone size={16} className="shrink-0 act"/><span className="min-w-0 flex-1"><b>{tr("Announcement:")}</b> {pin.text}</span>
          {admin&&<button onClick={()=>deleteDoc(doc(db,"announcements",pin.id))}><X size={16}/></button>}</div>}

        {view==="admin"?<Admin me={me} users={users} stats={stats} ann={ann} now={now}/>:view==="settings"?<Prefs me={me} logout={logout} prefs={prefs} save={save}/>:!peerU?(
          <div className="flex-1 grid place-items-center mu"><span className="pn rounded-full px-5 py-2 text-sm">{tr("Select a chat to start messaging")}</span></div>
        ):(<>
          <header className="border-b bl px-3 py-3 flex items-center gap-3">
            <button className="md:hidden mu" onClick={()=>setPeer(null)}><ArrowLeft/></button>
            <button className="flex items-center gap-3 min-w-0 text-left" onClick={()=>setProf(idOf(peerU))}>
              <Avatar u={peerU} size={42}/>
              <div className="min-w-0"><Name u={peerU}/><div className={`text-xs ${online(peerU,now)?"act":"mu"}`}>{seenTxt(peerU)}</div></div></button>
            <button onClick={()=>setGiftTo(idOf(peerU))} className="ml-auto act p-2"><Gift size={22}/></button>
          </header>
          <div className="flex-1 overflow-y-auto p-3 md:p-5 space-y-1.5" style={{backgroundImage:WALLS[prefs.wall],backgroundSize:WSIZE[prefs.wall]||"auto"}}>
            {thread.length===0&&<p className="text-center text-sm mu mt-6">{tr("No messages yet. Say hi!")}</p>}
            {thread.map(m=>{const mine=m.from===me.uid,g=gf(m.gift);return m.type==="gift"?(
              <div key={m.id} className="flex justify-center py-1">
                <div className={`pn tx rounded-xl p-4 text-center max-w-[80%] border-2 ${Date.now()-m.ts<4000?"gland":""}`} style={{borderColor:RC[g.r]}}>
                  <div className="flex justify-center"><GImg g={g} size={72}/></div>
                  <div className="font-bold">{mine?tr("You sent"):nameOf(users,m.from)+" "+tr("sent you")} {g.n}</div>
                  <div className="text-[10px] uppercase" style={{color:RC[g.r],letterSpacing:".2em"}}>{g.r}{g.max?` · ${tr("limited")} #${m.no}/${g.max}`:""}</div>
                  {m.text&&<div className="text-sm italic">"{m.text}"</div>}
                  <div className="text-[11px] opacity-80 mt-1">{time(m.ts)}</div>
                </div></div>):(
              <div key={m.id} className={`flex ${mine?"justify-end":"justify-start"}`}>
                <div className={`max-w-[80%] px-3.5 py-2 rounded-2xl ${mine?"out":"tx inb"}`}>
                  <span className="whitespace-pre-wrap break-words">{m.text}</span>
                  <span className={`ml-2 float-right mt-1.5 text-[11px] inline-flex items-center gap-0.5 ${mine?"text-white/80":"mu"}`}>{time(m.ts)}{mine&&(m.read?<CheckCheck size={14}/>:<Check size={14}/>)}</span>
                </div></div>)})}
            <div ref={end}/>
          </div>
          {me.banned?<div className="m-3 rounded-full bg-red-500/15 text-red-500 text-center text-sm py-3">{tr("You are banned from sending messages.")}</div>:(
            <div className="relative m-3 p-1.5 pn rounded-full flex items-center gap-1">
              {emo&&<div className="absolute bottom-full left-2 mb-2 pn solid rounded-2xl p-2 grid grid-cols-8 gap-1 w-72">
                {EMOJIS.map(e=><button key={e} onClick={()=>setText(t=>t+e)} className="text-xl hv rounded-full p-1">{e}</button>)}</div>}
              <button onClick={()=>setEmo(!emo)} className="mu p-2"><Smile size={24}/></button>
              <input className="inp pill" style={{background:"transparent"}} placeholder={tr("Write a message…")} value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} maxLength={2000}/>
              <button onClick={send} disabled={!text.trim()} className="acb disabled:opacity-40 w-11 h-11 rounded-full grid place-items-center shrink-0"><Send size={18}/></button>
            </div>)}
        </>)}
      </main>

      <nav className={`${inChat?"hidden md:flex":"flex"} pn fixed z-30 bottom-3 left-3 right-3 md:right-auto md:left-6 md:bottom-6 md:w-[296px] rounded-full p-1.5 gap-1`}>
        {nav("chats",MessageCircle,tr("Chats"),unreadAll)}{nav("users",Users,tr("Users"))}{nav("settings",Settings,tr("Settings"))}{admin&&nav("admin",Shield,tr("Admin"))}
      </nav>

      {profU&&<Profile u={profU} me={me} now={now} onClose={()=>setProf(null)} onChat={openChat} onGift={id=>{setProf(null);setGiftTo(id)}}/>}
      {giftU&&<GiftPicker to={giftU} me={me} free={false} onSent={(g,no)=>setAnim({g,no})} onClose={()=>setGiftTo(null)}/>}
      {anim&&<GiftAnim a={anim} onDone={()=>setAnim(null)} onHit={()=>{setHit(true);setTimeout(()=>setHit(false),500)}}/>}
    </div>);
}
const nameOf=(users,id)=>users.find(u=>u.uid===id)?.name||"Someone";

function App(){
  const [prefs,setPrefs]=useState(loadPrefs);
  LANG=prefs.lang||"en";
  const [au,setAu]=useState(undefined),[users,setUsers]=useState(null),[err,setErr]=useState("");
  const save=p=>{setPrefs(p);try{localStorage.setItem(PK,JSON.stringify(p))}catch{}};
  useEffect(()=>onAuthStateChanged(auth,setAu),[]);
  useEffect(()=>{
    if(!au){setUsers(null);return}
    return onSnapshot(collection(db,"users"),s=>setUsers(s.docs.map(fixU)),e=>setErr(e.message));
  },[au?.uid]);
  const me=au&&users&&users.find(u=>u.uid===au.uid);
  const logout=()=>signOut(auth);
  const wrap=c=><div style={cssVars(prefs)} className="tx bgm min-h-screen">{c}</div>;
  if(err)return wrap(<div className="p-6 text-red-500">Database error: {err}<br/>Check your firebaseConfig and Firestore rules.</div>);
  if(au===undefined||(au&&!users))return wrap(<div className="p-6 mu">Connecting…</div>);
  if(!au)return wrap(<Login/>);
  if(!me)return wrap(<Onboard au={au} users={users} logout={logout}/>);
  return wrap(<Messenger me={me} users={users} logout={logout} prefs={prefs} save={save}/>);
}

createRoot(document.getElementById("root")).render(configured?<App/>:<Setup/>);
</script>
</body>
