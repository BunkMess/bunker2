  const stat={gifts:increment(1),messages:increment(1)};
  if(g.max)entry.nf=msg.nf=rollNft();
  if(g.max){
    await runTransaction(db,async tx=>{
      const ref=doc(db,"nft",g.id),snap=await tx.get(ref),n=snap.exists()?(snap.data().minted||0):0;
      if(n>=g.max)throw new Error(g.n+" is sold out");
      entry.no=msg.no=n+1;
      tx.set(ref,{minted:n+1},{merge:true});
      if(!free)tx.update(doc(db,"users",fid),{coins:increment(-g.c)});
      tx.update(doc(db,"users",to),{gifts:arrayUnion(entry)});
      tx.set(doc(collection(db,"messages")),msg);
      tx.set(doc(db,"stats","global"),stat,{merge:true});
    });
    return {no:entry.no,nf:entry.nf};
  }
  const b=writeBatch(db);
  if(!free)b.update(doc(db,"users",fid),{coins:increment(-g.c)});
  b.update(doc(db,"users",to),{gifts:arrayUnion(entry)});
  b.set(doc(collection(db,"messages")),msg);
  b.set(doc(db,"stats","global"),stat,{merge:true});
  await b.commit();
}

async function sellGift(me,x){
  const price=Math.floor(gf(x.g).c*SELL),ref=doc(db,"users",me.uid);
  await runTransaction(db,async tx=>{
    const arr=((await tx.get(ref)).data().gifts||[]).slice(),i=arr.findIndex(y=>y.ts===x.ts&&y.g===x.g&&y.by===x.by);
    if(i<0)throw new Error("Gift not found");
    if(Date.now()-arr[i].ts>SELL_MS)throw new Error(tr("Sale expired"));
    arr.splice(i,1);tx.update(ref,{gifts:arr,coins:increment(price)});
  });
}

// Timeline: confetti burst + unique intro (1.1s) -> gift slams into the chat (0.5s) -> shockwave + chat shake
function GiftAnim({a,onDone}){
  const g=a.g,c=RC[g.r],ref=useRef(null);
  const [e,mode,n,vx=0,vy=0]=PT[g.id]||["✨","burst",12];
  const parts=useMemo(()=>Array.from({length:n},()=>({x:vx+(Math.random()-.5)*(vx?160:300),y:vy+(Math.random()-.5)*(vy?160:300),r:Math.round(Math.random()*540-270)+"deg",d:Math.random()*.7,s:18+Math.random()*20})),[]);
  const conf=useMemo(()=>Array.from({length:60},(_,i)=>{const an=Math.random()*6.283,di=120+Math.random()*300;return{x:Math.cos(an)*di,y:Math.sin(an)*di-80,r:Math.round(Math.random()*720)+"deg",c:CONF[i%CONF.length],w:6+Math.random()*7,h:10+Math.random()*8,d:Math.random()*.2,o:i%3?2:"50%"}}),[]);
  useEffect(()=>{
    ref.current.animate(INTRO[g.id]||K("scale(.3)","scale(1.25)","scale(1)"),{duration:1300,easing:"ease-out",fill:"forwards"});
    const t=setTimeout(onDone,2300);return()=>clearTimeout(t);
  },[]);
  return(
    <div className="fixed inset-0 z-[60] pointer-events-none overflow-hidden" style={{background:a.nf?`radial-gradient(circle at 50% 50%,${BDS[a.nf.bd%BDS.length][1]}cc,rgba(0,0,0,.8) 80%)`:"rgba(0,0,0,.6)",animation:"gover 2.3s forwards"}}>
      <div className="absolute" style={{left:"50%",top:"50%"}}>
        {conf.map((p,i)=><span key={i} className="absolute" style={{width:p.w,height:p.h,background:p.c,borderRadius:p.o,"--x":p.x+"px","--y":p.y+"px","--r":p.r,animation:`gconf 1.6s ${p.d}s cubic-bezier(.1,.7,.3,1) both`}}/>)}
        {parts.map((p,i)=><span key={"p"+i} className="absolute" style={{fontSize:p.s,"--x":p.x+"px","--y":p.y+"px","--r":p.r,animation:`${mode==="up"?"gup":mode==="fall"?"gfall":"gfly"} 1.6s ${p.d}s ease-out both`}}>{e}</span>)}
        <div className="absolute" style={{left:-70,top:-70,filter:g.max?`drop-shadow(0 0 26px ${c})`:undefined}}><div ref={ref}><GImg g={g} size={140}/></div></div>
        <div className="absolute whitespace-nowrap text-xs uppercase" style={{left:0,top:100,transform:"translateX(-50%)",color:c,letterSpacing:".3em",animation:"gtext 1.8s forwards"}}>{g.n}{a.no?` · #${a.no}/${g.max}`:""}</div>
      </div>
    </div>);
}

const RLAB={group:"Group",channel:"Channel",bot:"Bot"};

const FATHER={id:"botfather",type:"bot",fath:true,name:"BotFather",username:"BotFather",verified:true,emoji:"🤖",color:"#2787f5",desc:"Create and manage your bots",cmds:"newbot - Create a new bot\nmybots - List your bots\nhelp - Show help\ncancel - Cancel",createdAt:0,lastTs:0,members:[]};

// ---- bot engine (runs in the browser of whoever writes to the bot) ----
// Rule line: trigger => reply || Label:/cmd, Label:url:https://x.com ; NextRow:data      ("*" = fallback)
const parseKb=x=>x.split(";").map(r=>r.split(",").map(b=>{const i=b.indexOf(":");return{t:b.slice(0,i).trim(),d:b.slice(i+1).trim()}}).filter(b=>b.t&&b.d)).filter(r=>r.length);
const fillT=(x,me)=>x.replace(/\{name\}/g,me.name).replace(/\{username\}/g,me.username).replace(/\{time\}/g,new Date().toLocaleTimeString()).replace(/\{roll\}/g,1+Math.floor(Math.random()*100)).replace(/\{coin\}/g,Math.random()<.5?"Heads":"Tails");
const ruleReply=(b,t,me)=>{
  const lo=t.toLowerCase().replace(/@\w+/,"").trim(),L2=(b.rules||"").split("\n");
  const mk2=v=>{const [a,k]=v.split("||");return{text:fillT(a.trim(),me),kb:k?parseKb(k):undefined}};
  for(const ln of L2){const i=ln.indexOf("=>");if(i<1)continue;const k=ln.slice(0,i).trim().toLowerCase();if(k&&k!=="*"&&(k.startsWith("/")?lo.split(" ")[0]===k:lo.includes(k)))return mk2(ln.slice(i+2))}
  const d=L2.find(l=>l.trim().startsWith("*")&&l.includes("=>"));return d?mk2(d.slice(d.indexOf("=>")+2)):null;
};
// Webhook bots: POST {bot,chat,text,from} -> {text, keyboard:[[{text,data|url}]]}  (needs CORS on your server)
const runBot=async(b,t,me,th)=>{
  if(b.hook){try{
    const j=await (await fetch(b.hook,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bot:b.username,chat:th,text:t,from:{id:me.uid,name:me.name,username:me.username}})})).json();
    if(j&&j.text)return{text:String(j.text),kb:Array.isArray(j.keyboard)?j.keyboard.map(r=>r.map(x=>({t:x.text,d:x.data||(x.url?"url:"+x.url:"")})).filter(x=>x.t&&x.d)).filter(r=>r.length):undefined};
  }catch{}}
  return ruleReply(b,t,me);
};const marketBot=async(t,me,say)=>{
  const k="mkt_"+me.uid;let st={};try{st=JSON.parse(localStorage.getItem(k))||{}}catch{}

  if(c==="/market"){
    const s=await getDocs(collection(db,"market"));

    const kb=items.slice(0,15).map(x=>{const g=gf(x.item.g);return[{t:`${g.e} ${g.n} #${x.item.no} — ${x.price} 🪙 (${x.sellerName})`,d:"/buy_"+x.id}]});
    kb.push([{t:"🔄 Обновить",d:"/market"},{t:"⬅️ Меню",d:"/start"}]);

  }
  if(c==="/sell"){
    const nfts=(me.gifts||[]).map((x,idx)=>({x,idx,g:gf(x.g)})).filter(o=>o.g.max);
    if(!nfts.length)return say("У тебя пока нет лимитированных NFT для продажи.",[[{t:"🛒 Перейти к покупкам",d:"/market"}]]);
    const kb=nfts.map(o=>[{t:`${o.g.e} ${o.g.n} #${o.x.no}`,d:"/pick_"+o.idx}]);
    kb.push([{t:"⬅️ Отмена",d:"/start"}]);
    return say("Выбери NFT из своей витрины, который хочешь выставить на продажу:",kb);
  }
  if(c.startsWith("/pick_")){
    const idx=Number(c.slice(6)),item=(me.gifts||[])[idx];
    if(!item||!gf(item.g).max)return say("Этот NFT не найден.");
    localStorage.setItem(k,JSON.stringify({idx,item}));
    return say(`Введи цену в монетах для ${gf(item.g).n} #${item.no} (например: 15000):`,[[{t:"❌ Отмена",d:"/start"}]]);
  }
  if(st.item&&/^\d+$/.test(c)){
    const price=Math.max(1,Math.min(10000000,Number(c)));localStorage.removeItem(k);
    try{
      await runTransaction(db,async tx=>{
        const uref=doc(db,"users",me.uid),arr=((await tx.get(uref)).data().gifts||[]).slice();
        const i=arr.findIndex(y=>y.ts===st.item.ts&&y.g===st.item.g&&y.no===st.item.no);
        if(i<0)throw new Error("NFT уже продан или снят.");
        const [item]=arr.splice(i,1);
        tx.update(uref,{gifts:arr});
        tx.set(doc(collection(db,"market")),{seller:me.uid,sellerName:me.name,price,item,ts:Date.now()});
      });
      return say(`✅ Лот выставлен на рынок за ${price} 🪙!`,[[{t:"🛒 Смотреть рынок",d:"/market"},{t:"📦 Мои лоты",d:"/mylots"}]]);
    }catch(e){return say("Ошибка: "+e.message);}
  }
  if(c==="/mylots"){
    const s=await getDocs(query(collection(db,"market"),where("seller","==",me.uid)));
    const mine=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!mine.length)return say("У тебя нет активных лотов на продаже.",[[{t:"💰 Продать NFT",d:"/sell"},{t:"⬅️ Меню",d:"/start"}]]);
    const kb=mine.map(x=>[{t:`❌ Снять: ${gf(x.item.g).n} #${x.item.no} (${x.price} 🪙)`,d:"/cancel_"+x.id}]);
    kb.push([{t:"⬅️ Меню",d:"/start"}]);
    return say("Твои активные лоты (нажми, чтобы снять с продажи и вернуть в профиль):",kb);
  }
  if(c.startsWith("/cancel_")){
    const lid=c.slice(8);
    try{
      await runTransaction(db,async tx=>{
        const lref=doc(db,"market",lid),lsnap=await tx.get(lref);
        if(!lsnap.exists()||lsnap.data().seller!==me.uid)throw new Error("Лот уже куплен или удалён.");
        tx.delete(lref);
        tx.update(doc(db,"users",me.uid),{gifts:arrayUnion(lsnap.data().item)});
      });
      return say("↩️ Лот снят с продажи, NFT вернулся в твой профиль!",[[{t:"📦 Мои лоты",d:"/mylots"},{t:"⬅️ Меню",d:"/start"}]]);
    }catch(e){return say("Ошибка: "+e.message);}
  }
  if(c.startsWith("/buy_")){
    const lid=c.slice(5);
    try{
      let info="";
      await runTransaction(db,async tx=>{
        const lref=doc(db,"market",lid),lsnap=await tx.get(lref);
        if(!lsnap.exists())throw new Error("Этот лот уже кто-то выкупил!");
        const lot=lsnap.data();
        if(lot.seller===me.uid)throw new Error("Нельзя купить свой же лот. Используй /mylots, чтобы снять его.");
        const bref=doc(db,"users",me.uid),bsnap=await tx.get(bref);
        if((bsnap.data().coins||0)<lot.price)throw new Error(`Не хватает монет! Нужно ${lot.price} 🪙.`);
        const bought={...lot.item,by:lot.seller,n:lot.sellerName+" (Market)",ts:Date.now()};
        tx.delete(lref);
        tx.update(bref,{coins:increment(-lot.price),gifts:arrayUnion(bought)});
        tx.update(doc(db,"users",lot.seller),{coins:increment(lot.price)});
        info=`${gf(lot.item.g).n} #${lot.item.no} за ${lot.price} 🪙`;
      });
      return say(`🎉 Поздравляем! Ты купил ${info}! Он уже на витрине твоего профиля.`,[[{t:"🛒 К рынку",d:"/market"},{t:"⬅️ Меню",d:"/start"}]]);
    }catch(e){return say("❌ "+e.message,[[{t:"🛒 Вернуться на рынок",d:"/market"}]]);}
  }
  return say("Используй кнопки меню или /start",[[{t:"🛒 Открыть маркет",d:"/start"}]]);
};
const father=async(t,me,rooms,say)=>{

          {m.kb&&<div className="mt-1 space-y-1 w-full max-w-[80%]">{m.kb.map((row,i)=><div key={i} className="flex gap-1">{row.b.map((b,j)=><button key={j} onClick={()=>press(m.from,b.d)} className="flex-1 pn rounded-xl px-3 py-1.5 text-sm act">{b.d.startsWith("url:")?"↗ ":""}{b.t}</button>)}</div>)}</div>}
        </div>)})}
      <div ref={end}/>
    </div>
    {can?(bot&&ms.length===0?<div className="m-3"><button onClick={()=>send("/start")} className={B+" w-full rounded-full"}>{tr("START")}</button></div>:(
      <div className="relative m-3 p-1.5 pn rounded-full flex items-center gap-1">
        {menu&&<div className="absolute bottom-full left-2 mb-2 pn solid rounded-2xl p-2 w-72 max-h-60 overflow-y-auto">{cmds.map((x,i)=><button key={i} onClick={()=>send(x.c)} className="w-full text-left px-3 py-1.5 rounded-xl hv text-sm"><b className="act">{x.c}</b> <span className="mu">{x.d}</span></button>)}</div>}
        {cmds.length>0&&<button onClick={()=>setMenu(!menu)} className="mu px-2.5 text-xl font-bold">/</button>}
        <input className="inp pill" style={{background:"transparent"}} placeholder={tr("Write a message…")} value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(prefs.ent!==false||e.ctrlKey)&&send()} maxLength={2000}/>
        <button onClick={()=>send()} disabled={!text.trim()} className="acb disabled:opacity-40 w-11 h-11 rounded-full grid place-items-center shrink-0"><Send size={18}/></button>
      </div>)
    ):<div className="m-3">{!isM&&!me.banned?<button onClick={()=>updateDoc(doc(db,"chats",r.id),{members:arrayUnion(me.uid)})} className={B+" w-full rounded-full"}>{tr("Join to write")}</button>:<div className="pn rounded-full text-center text-sm mu py-3">{me.banned?tr("You are banned from sending messages."):tr("Only the owner can post")}</div>}</div>}
    {info&&<RoomInfo r={r} me={me} admin={admin} users={users} rooms={rooms} onClose={()=>setInfo(false)} onGone={()=>{setInfo(false);onGone()}}/>}
  </>);
}

const Pat=({nf,g})=>{
  const sym=nf.pt>=12?g.e:PATS[nf.pt%PATS.length];
  return(
    <div className="absolute inset-0 overflow-hidden pointer-events-none select-none" style={{opacity:.24}}>
      {(nf.pl||0)%2===0?<div style={{fontSize:18,lineHeight:"24px",letterSpacing:"10px",wordBreak:"break-all"}}>{sym.repeat(260)}</div>:
        [[6,26,18],[10,40,14],[14,54,11]].flatMap(([n,r,fs],k)=>Array.from({length:n},(_,i)=>{const a=i/n*6.283+k;return<span key={k+"-"+i} className="absolute" style={{left:`${50+Math.cos(a)*r*1.5}%`,top:`${50+Math.sin(a)*r}%`,fontSize:fs,transform:"translate(-50%,-50%)"}}>{sym}</span>}))}
    </div>);
};

function GiftCard({m,g,mine,users,prefs}){
  const nf=g.max&&m.nf,c=RC[g.r];
  return(
    <div className="flex justify-center py-1"><div className={`relative overflow-hidden ${nf?"text-white":"pn tx"} rounded-xl p-4 text-center w-56 max-w-[80%] border-2`} style={nf?{...nftStyle(nf),borderColor:c,...frameStyle(nf,c)}:{borderColor:c,background:`radial-gradient(circle at 50% 30%,${c}55,transparent 70%),var(--glass)`}}>
      {nf&&<Pat nf={nf} g={g}/>}
      <div className="relative">
        <div className="flex justify-center"><GImg g={g} size={72}/></div>
        <div className="font-bold">{mine?tr("You sent"):nameOf(users,m.from)+" "+tr("sent you")} {g.n}</div>
        <div className="text-[10px] uppercase" style={{color:nf?"#fff":c,letterSpacing:".2em"}}>{g.r}{g.max?` · ${tr("limited")} #${m.no}/${g.max}`:""}</div>
        {nf&&<div className="text-[10px] opacity-80">{BDN[nf.bd%BDN.length]} · {PTN[nf.pt%PTN.length]} · {SYN[(nf.sy||0)%5]}</div>}
        {m.text&&<div className="text-sm italic">"{m.text}"</div>}
        <div className="text-[11px] opacity-80 mt-1">{time(m.ts)}</div>
      </div></div></div>);
}

function Messenger({me,users,logout,prefs,save}){
  const admin=me.username===ADMIN_USERNAME;
  const [tab,setTab]=useState("chats"),[peer,setPeer]=useState(null),[q,setQ]=useState(""),[text,setText]=useState(""),[emo,setEmo]=useState(false);
  const [prof,setProf]=useState(null),[giftTo,setGiftTo]=useState(null),[anim,setAnim]=useState(null),[dl,setDl]=useState(0),[hit,setHit]=useState(false),[rooms,setRooms]=useState([FATHER]),[room,setRoom]=useState(null),[mk,setMk]=useState(false),[usub,setUsub]=useState("people");
  const [ub,setUb]=useState(()=>{try{return JSON.parse(localStorage.getItem("bunk_bots"))||[]}catch{return[]}}),[rd,setRd]=useState(()=>{try{return JSON.parse(localStorage.getItem("bunk_rd"))||{}}catch{return{}}});
  const seenIds=useRef(null),pc=useRef(me.coins||0),pr=useRef(prefs);
  pr.current=prefs;
  const [msgs,setMsgs]=useState([]),[ann,setAnn]=useState([]),[stats,setStats]=useState({}),[now,setNow]=useState(Date.now());
  const end=useRef(null);
  const withId=s=>s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.ts-b.ts);

  useEffect(()=>{
    const u1=onSnapshot(query(collection(db,"messages"),where("participants","array-contains",me.uid)),s=>{
      const arr=withId(s);

      else{const fresh=arr.filter(m=>!seenIds.current.has(m.id));fresh.forEach(m=>seenIds.current.add(m.id));
        const gm=fresh.filter(m=>m.type==="gift"&&m.to===me.uid&&Date.now()-m.ts<20000).pop();if(gm&&pr.current.anim!==false)setAnim({g:gf(gm.gift),no:gm.no,nf:gm.nf});if(pr.current.snd&&fresh.some(m=>m.to===me.uid))beep()}
      setMsgs(arr)});
    const u2=onSnapshot(collection(db,"announcements"),s=>setAnn(withId(s)));
    const u3=onSnapshot(doc(db,"stats","global"),s=>setStats(s.data()||{}));
    const u4=onSnapshot(collection(db,"chats"),s=>setRooms([FATHER,...s.docs.map(d=>({...d.data(),id:d.id}))]));
    const beat=()=>{updateDoc(doc(db,"users",me.uid),{lastSeen:Date.now()}).catch(()=>{});setNow(Date.now())};
    beat(); const i=setInterval(beat,30000);
    return()=>{u1();u2();u3();u4();clearInterval(i)};
  },[me.uid]);

  useEffect(()=>{const c=me.coins||0;if(c!==pc.current){setDl(c-pc.current);pc.current=c;const t=setTimeout(()=>setDl(0),1800);return()=>clearTimeout(t)}},[me.coins]);
  const byId=id=>id?users.find(u=>idOf(u)===id):undefined;
  const peerU=byId(peer),roomU=room?rooms.find(r=>r.id===room):undefined;
  const markRead=id=>setRd(o=>{const n={...o,[id]:Date.now()};try{localStorage.setItem("bunk_rd",JSON.stringify(n))}catch{}return n});
  const openRoom=id=>{const r=rooms.find(x=>x.id===id);setRoom(id);setPeer(null);setProf(null);setTab("chats");markRead(id);if(r&&r.type==="bot"&&!ub.includes(id)){const n=[...ub,id];setUb(n);try{localStorage.setItem("bunk_bots",JSON.stringify(n))}catch{}}};
  const profU=byId(prof),giftU=byId(giftTo);
  const thread=useMemo(()=>msgs.filter(m=>m.from===peer||m.to===peer),[msgs,peer]);
  const convos=useMemo(()=>{
    const m={};
    msgs.forEach(x=>{const p=x.from===me.uid?x.to:x.from;m[p]=m[p]||{unread:0};m[p].last=x;if(x.to===me.uid&&!x.read)m[p].unread++;});

  const unreadAll=Object.values(convos).reduce((a,c)=>a+c.unread,0);

  useEffect(()=>{
    if(!peer)return;
    const un=msgs.filter(m=>m.from===peer&&m.to===me.uid&&!m.read);if(!un.length)return;
    const b=writeBatch(db);un.forEach(m=>b.update(doc(db,"messages",m.id),{read:true}));b.commit().catch(()=>{});
  },[msgs,peer]);
  useEffect(()=>{end.current?.scrollIntoView({behavior:"smooth"})},[thread.length,peer]);

  const openChat=id=>{if(!id)return;setRoom(null);setPeer(id);setProf(null);setTab("chats")};
  const send=async()=>{
    const t=text.trim(),to=idOf(peerU);if(!t||!to||me.banned)return;setText("");setEmo(false);
    try{

      setDoc(doc(db,"stats","global"),{messages:increment(1)},{merge:true});
    }catch(e){alert("Could not send: "+e.message)}
  };

  const list=users.filter(u=>u.uid!==me.uid)
    .filter(u=>tab==="users"||convos[u.uid])
    .filter(u=>(u.name+u.username).toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>tab==="users"?a.name.localeCompare(b.name):convos[b.uid].last.ts-convos[a.uid].last.ts);
  const roomMatch=r=>((r.name||"")+" "+(r.username||"")).toLowerCase().includes(q.toLowerCase());
  const myRooms=rooms.filter(r=>roomMatch(r)&&(r.owner===me.uid||(r.members||[]).includes(me.uid)||(r.type==="bot"&&ub.includes(r.id))));
  const found=rooms.filter(r=>roomMatch(r)&&(usub==="bots"?r.type==="bot":r.type!=="bot"));
  const rows=tab==="users"?(usub==="people"?list.map(u=>({u})):found.map(r=>({r}))):[...list.map(u=>({u,ts:convos[u.uid].last.ts})),...myRooms.map(r=>({r,ts:r.lastTs||r.createdAt}))].sort((a,b)=>b.ts-a.ts);
  const view=tab==="settings"||(tab==="admin"&&admin)?tab:"chat";
  const showMain=view!=="chat"||!!peerU||!!roomU;
  const pin=ann[ann.length-1];
  const nav=(id,Icon,label,badge)=>(
    <button key={id} onClick={()=>setTab(id)} className={`relative flex-1 flex flex-col items-center gap-0.5 py-2 rounded-full transition ${tab===id?"dockon":"mu"}`}>

      {badge>0&&<span className="absolute top-1 right-[20%] min-w-4 h-4 px-1 rounded-full bg-red-500 text-white text-[10px] grid place-items-center">{badge}</span>}
    </button>);
  const inChat=view==="chat"&&(!!peerU||!!roomU);
  const seenTxt=u=>status(u,now);

  return(
    <div className="flex tx overflow-hidden" style={{height:"100dvh"}}>
      <aside className={`${showMain?"hidden md:flex":"flex"} w-full md:w-80 pn flex-col shrink-0 md:m-3 md:mr-0 md:rounded-[28px] overflow-hidden`}>
        <div className="p-3 space-y-3">
          <div className="flex items-center gap-3 cursor-pointer" onClick={()=>setTab("settings")}>
            <Avatar u={me} size={44}/>
            <div className="min-w-0 flex-1"><Name u={me}/><div className="text-xs mu truncate">{tr("Account settings")}</div></div>
            <span className="relative text-sm mu flex items-center gap-1 shrink-0"><Coins size={14}/>{me.coins||0}{dl!==0&&<span className={`gdelta ${dl<0?"text-red-500":"text-green-500"}`}>{dl>0?"+":""}{dl}</span>}</span>
          </div>
          <div className="flex gap-2"><div className="relative flex-1"><Search size={16} className="absolute left-4 top-3.5 mu"/>
            <input className="inp pill pl-10" placeholder={tr("Search")} value={q} onChange={e=>setQ(e.target.value)}/></div>
            <button title={tr("Create")} onClick={()=>setMk(true)} className="acb w-11 h-11 rounded-full grid place-items-center shrink-0"><Plus size={20}/></button></div>
          {tab==="users"&&<Seg opts={[["people","People"],["rooms","Groups & Channels"],["bots","Bots"]]} v={usub} set={setUsub}/>}
        </div>
        <div className="flex-1 overflow-y-auto pb-28">
          {rows.length===0&&<p className="text-center text-sm mu p-6">{tab==="users"?tr("No users found."):tr("No chats yet. Open Users to start one.")}</p>}
          {rows.map(row=>{
            if(row.r){const r=row.r,un=r.lastTs>(rd[r.id]||0)&&room!==r.id&&r.lastBy&&r.lastBy!==me.name;return(
              <div key={r.id} onClick={()=>openRoom(r.id)} className={`mx-2 flex items-center gap-3 px-3 py-2.5 rounded-2xl cursor-pointer hv ${room===r.id?"sel":""}`}>
                <Avatar u={r}/>
                <div className="min-w-0 flex-1">
                  <div className="flex justify-between gap-2"><Name u={r}/>{r.last&&<span className="text-xs mu shrink-0">{time(r.lastTs)}</span>}</div>
                  <div className="flex justify-between gap-2"><span className="text-sm mu truncate">{r.last?`${r.lastBy}: ${r.last}`:tr(RLAB[r.type])+(r.desc?" · "+r.desc:"")}</span>{un&&<span className="w-2.5 h-2.5 mt-1.5 rounded-full acb shrink-0"/>}</div>
                </div></div>)}
            const u=row.u,c=convos[u.uid];return(
            <div key={u.uid} onClick={()=>tab==="users"?setProf(idOf(u)):openChat(idOf(u))} className={`mx-2 flex items-center gap-3 px-3 py-2.5 rounded-2xl cursor-pointer hv ${peer===u.uid?"sel":""}`}>
              <span onClick={e=>{e.stopPropagation();setProf(idOf(u))}}><Avatar u={u} dot={online(u,now)}/></span>
              <div className="min-w-0 flex-1">
                <div className="flex justify-between gap-2"><Name u={u}/>{c&&<span className="text-xs mu shrink-0">{time(c.last.ts)}</span>}</div>
                <div className="flex justify-between gap-2">
                  <span className="text-sm mu truncate">{c?(c.last.from===me.uid?tr("You")+": ":"")+prev(c.last):"@"+u.username}</span>
                  {c&&c.unread>0&&<span className="min-w-5 h-5 px-1.5 rounded-full acb text-xs grid place-items-center shrink-0">{c.unread}</span>}
                </div>

        </div>

          <div className="flex-1 grid place-items-center mu"><span className="pn rounded-full px-5 py-2 text-sm">{tr("Select a chat to start messaging")}</span></div>

          <header className="border-b bl px-3 py-3 flex items-center gap-3">

              <GiftCard key={m.id} m={m} g={g} mine={mine} users={users} prefs={prefs}/>):(

                  <span className={`ml-2 float-right mt-1.5 text-[11px] inline-flex items-center gap-0.5 mu`}>{prefs.ts!==false&&time(m.ts)}{mine&&prefs.rc!==false&&(m.read?<CheckCheck size={14}/>:<Check size={14}/>)}</span>

              <input className="inp pill" style={{background:"transparent"}} placeholder={tr("Write a message…")} value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(prefs.ent!==false||e.ctrlKey)&&send()} maxLength={2000}/>
              <button onClick={send} disabled={!text.trim()} className="acb disabled:opacity-40 w-11 h-11 rounded-full grid place-items-center shrink-0"><Send size={18}/></button>
            </div>)}
        </>)}
      </main>

      <nav className={`${inChat?"hidden md:flex":"flex"} pn dock fixed z-30 bottom-3 left-3 right-3 md:right-auto md:left-6 md:bottom-6 md:w-[296px] rounded-full p-1.5 gap-1`}>
        {nav("chats",MessageCircle,tr("Chats"),unreadAll)}{nav("users",Users,tr("Users"))}{nav("settings",Settings,tr("Settings"))}{admin&&nav("admin",Shield,tr("Admin"))}
      </nav>

      {profU&&<Profile u={profU} me={me} now={now} onClose={()=>setProf(null)} onChat={openChat} onGift={id=>{setProf(null);setGiftTo(id)}}/>}
      {giftU&&<GiftPicker to={giftU} me={me} free={false} onSent={(g,r)=>prefs.anim!==false&&setAnim({g,no:r&&r.no,nf:r&&r.nf})} onClose={()=>setGiftTo(null)}/>}
      {mk&&<CreateRoom me={me} onClose={()=>setMk(false)} onDone={id=>{setMk(false);openRoom(id)}}/>}
      {anim&&<GiftAnim a={anim} onDone={()=>setAnim(null)} onHit={()=>{setHit(true);setTimeout(()=>setHit(false),500)}}/>}
    </div>);
}
const nameOf=(users,id)=>users.find(u=>u.uid===id)?.name||"Someone";

function App(){
  const [prefs,setPrefs]=useState(loadPrefs);
  LANG=prefs.lang||"en";H12=!!prefs.h12;
  const [au,setAu]=useState(undefined),[users,setUsers]=useState(null),[err,setErr]=useState("");
  const save=p=>{setPrefs(p);try{localStorage.setItem(PK,JSON.stringify(p))}catch{}};
  useEffect(()=>onAuthStateChanged(auth,setAu),[]);
  useEffect(()=>{
    if(!au){setUsers(null);return}
    return onSnapshot(collection(db,"users"),s=>setUsers(s.docs.map(fixU)),e=>setErr(e.message));
  },[au?.uid]);
  const me=au&&users&&users.find(u=>u.uid===au.uid);
  const logout=()=>signOut(auth);
  const wrap=c=><div data-bs={prefs.bs||"glass"} style={{...cssVars(prefs),fontFamily:FONTS[prefs.font]}} className="tx bgm min-h-screen">{c}</div>;
  if(err)return wrap(<div className="p-6 text-red-500">Database error: {err}<br/>Check your firebaseConfig and Firestore rules.</div>);
  if(au===undefined||(au&&!users))return wrap(<div className="p-6 mu">Connecting…</div>);
  if(!au)return wrap(<Login/>);
  if(!me)return wrap(<Onboard au={au} users={users} logout={logout}/>);
  return wrap(<Messenger me={me} users={users} logout={logout} prefs={prefs} save={save}/>);
}
